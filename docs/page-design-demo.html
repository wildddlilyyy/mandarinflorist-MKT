<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文華花苑頁面設計 Demo</title>
  <meta name="description" content="文華花苑花藝設計總覽、作品集列表、服務介紹、花藝學校介紹及近期課表與過往紀錄提案。">
  <style>
    :root { --ink:#173f35; --muted:#64748b; --accent:#16805c; --line:#d7e1dc; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif; background:#f7f8f3; }
    .topbar { display:flex; justify-content:space-between; align-items:center; gap:16px; max-width:1180px; margin:0 auto; padding:24px 28px; }
    .brand { font-weight:800; letter-spacing:.02em; }
    .back { color:var(--accent); font-size:14px; font-weight:800; text-decoration:none; }
    .wrap { max-width:1180px; margin:0 auto; padding:30px 28px 80px; }
    .eyebrow { margin:0 0 10px; color:var(--accent); font-size:13px; font-weight:800; letter-spacing:.1em; }
    h1 { margin:0; font-size:clamp(32px,5vw,52px); line-height:1.2; }
    .intro { max-width:680px; color:var(--muted); line-height:1.8; }
    .tabs { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px; margin:30px 0 0; }
    .tab { padding:15px 12px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); font:inherit; font-weight:700; cursor:pointer; }
    .tab:hover { border-color:var(--accent); }
    .tab[aria-selected="true"] { background:var(--ink); color:#fff; border-color:var(--ink); }
    .tab:focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
    [hidden] { display:none !important; }
    .preview { margin:24px 0 0; padding:12px; border:1px solid var(--line); border-radius:12px; background:#fff; box-shadow:0 18px 50px rgba(23,63,53,.08); }
    .preview img { display:block; width:auto; max-width:100%; height:auto; max-height:none; aspect-ratio:auto; object-fit:contain; margin-inline:auto; border-radius:6px; }
    .caption { margin:18px 4px 4px; color:var(--muted); font-size:13px; }
    .empty { min-height:380px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:35px; text-align:center; background:#f5f5ef; border:1px dashed var(--line); border-radius:6px; }
    .empty h2 { font-size:26px; margin:0 0 10px; }
    .empty p { color:var(--muted); line-height:1.8; margin:0; }
    @media (min-width:701px) and (max-width:1050px) { .tabs { grid-template-columns:repeat(3,minmax(0,1fr)); } }
    @media (max-width:700px) { .topbar,.wrap { padding-left:20px; padding-right:20px; } .topbar { align-items:flex-start; flex-direction:column; } .tabs { grid-template-columns:repeat(2,minmax(0,1fr)); } .empty { min-height:280px; } }
  </style>
</head>
<body>
  <header class="topbar"><div class="brand">MANDARIN FLORIST</div><a class="back" href="index.html">← 回首頁</a></header>
  <main class="wrap">
    <p class="eyebrow">PAGE DESIGN DEMO</p>
    <h1>文華花苑頁面設計提案</h1>
    <p class="intro">切換下方頁籤，查看花藝設計總覽、花藝設計作品集列表、服務介紹、花藝學校介紹及近期課表與過往紀錄的版面提案。</p>
    <div class="tabs" role="tablist" aria-label="頁面設計提案">
      <button class="tab" id="tab-floral-design" role="tab" aria-selected="true" aria-controls="floral-design">花藝設計總覽</button>
      <button class="tab" id="tab-portfolio-list" role="tab" aria-selected="false" aria-controls="portfolio-list" tabindex="-1">花藝設計作品集列表</button>
      <button class="tab" id="tab-service" role="tab" aria-selected="false" aria-controls="service" tabindex="-1">服務介紹</button>
      <button class="tab" id="tab-school-service" role="tab" aria-selected="false" aria-controls="school-service" tabindex="-1">花藝學校介紹</button>
      <button class="tab" id="tab-class" role="tab" aria-selected="false" aria-controls="class" tabindex="-1">近期課表與過往紀錄</button>
    </div>
    <section id="floral-design" role="tabpanel" aria-labelledby="tab-floral-design" tabindex="0"><figure class="preview"><img src="assets/proposals/floral_design_portfolio.jpg" width="2400" height="5808" alt="文華花苑花藝設計總覽提案：作品分類、節慶場景與聯絡入口"><figcaption class="caption">花藝設計總覽</figcaption></figure></section>
    <section id="portfolio-list" role="tabpanel" aria-labelledby="tab-portfolio-list" tabindex="0" hidden><figure class="preview"><img src="assets/proposals/portfolio_list.jpg" width="2400" height="2045" alt="文華花苑花藝設計作品集列表提案"><figcaption class="caption">花藝設計作品集列表</figcaption></figure></section>
    <section id="service" role="tabpanel" aria-labelledby="tab-service" tabindex="0" hidden><figure class="preview"><img src="assets/proposals/service_demo.jpg" width="2400" height="5898" alt="文華花苑服務介紹提案：品牌客製花禮、專案花藝設計與企業包月"><figcaption class="caption">服務介紹</figcaption></figure></section>
    <section id="school-service" role="tabpanel" aria-labelledby="tab-school-service" tabindex="0" hidden><figure class="preview"><img src="assets/proposals/school_service.jpg" width="2400" height="7060" alt="文華花苑花藝學校介紹提案：每月小班花藝、企業包班與客製化教學"><figcaption class="caption">花藝學校介紹</figcaption></figure></section>
    <section id="class" role="tabpanel" aria-labelledby="tab-class" tabindex="0" hidden><figure class="preview"><img src="assets/proposals/class_list.jpg" width="2400" height="5483" alt="文華花苑近期課表與過往紀錄提案"><figcaption class="caption">近期課表與過往紀錄</figcaption></figure></section>
  </main>
  <script>
    const tabs = [...document.querySelectorAll('[role="tab"]')];
    function activate(tab, focus = false) {
      for (const item of tabs) {
        const selected = item === tab;
        item.setAttribute('aria-selected', String(selected));
        item.tabIndex = selected ? 0 : -1;
        document.getElementById(item.getAttribute('aria-controls')).hidden = !selected;
      }
      history.replaceState(null, '', '#' + tab.getAttribute('aria-controls'));
      if (focus) tab.focus();
    }
    for (const tab of tabs) {
      tab.addEventListener('click', () => activate(tab));
      tab.addEventListener('keydown', event => {
        const index = tabs.indexOf(tab);
        const next = event.key === 'ArrowRight' ? (index+1)%tabs.length : event.key === 'ArrowLeft' ? (index+tabs.length-1)%tabs.length : event.key === 'Home' ? 0 : event.key === 'End' ? tabs.length-1 : -1;
        if (next >= 0) { event.preventDefault(); activate(tabs[next], true); }
      });
    }
    function selectHash() {
      const match = tabs.find(tab => '#' + tab.getAttribute('aria-controls') === location.hash);
      if (match) activate(match);
    }
    selectHash();
    addEventListener('hashchange', selectHash);
  </script>
</body>
</html>
